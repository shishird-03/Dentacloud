uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakartaAnnotation" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }

