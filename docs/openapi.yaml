openapi: 3.1.0
info:
  title: DentaCloud API
  version: v1
servers:
- url: /
security:
- bearer: []
paths:
  /api/v1/appointments:
    get:
      operationId: appointmentList
      parameters:
      - in: query
        name: from
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        required: true
        schema:
          type: string
          format: date-time
      - in: query
        name: dentistId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppointmentDto"
          description: OK
      tags:
      - appointment-controller
    post:
      operationId: appointmentCreate
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentDto"
          description: Created
      tags:
      - appointment-controller
  /api/v1/appointments/{id}/reschedule:
    post:
      operationId: appointmentReschedule
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reschedule"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentDto"
          description: OK
      tags:
      - appointment-controller
  /api/v1/appointments/{id}/status:
    patch:
      operationId: appointmentStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChange"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentDto"
          description: OK
      tags:
      - appointment-controller
  /api/v1/audit-events:
    get:
      operationId: auditList
      parameters:
      - in: query
        name: afterId
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 200
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEventDto"
          description: OK
      tags:
      - audit-controller
  /api/v1/audit-events/verify:
    get:
      operationId: auditVerify
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Verification"
          description: OK
      tags:
      - audit-controller
  /api/v1/auth/login:
    post:
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "204":
          description: No Content
      tags:
      - auth-controller
  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: OK
      tags:
      - auth-controller
  /api/v1/auth/signup:
    post:
      operationId: authSignup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Created
      tags:
      - auth-controller
  /api/v1/clinic:
    get:
      operationId: clinicGet
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClinicDto"
          description: OK
      tags:
      - clinic-controller
    patch:
      operationId: clinicPatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicPatch"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClinicDto"
          description: OK
      tags:
      - clinic-controller
  /api/v1/clinic/chairs:
    get:
      operationId: clinicChairs
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChairDto"
          description: OK
      tags:
      - clinic-controller
    post:
      operationId: clinicAddChair
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewChair"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChairDto"
          description: Created
      tags:
      - clinic-controller
  /api/v1/clinic/members:
    get:
      operationId: clinicMembers
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberDto"
          description: OK
      tags:
      - clinic-controller
    post:
      operationId: clinicAddMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMember"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberDto"
          description: Created
      tags:
      - clinic-controller
  /api/v1/clinic/roles:
    get:
      operationId: clinicRoles
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleDto"
          description: OK
      tags:
      - clinic-controller
  /api/v1/devices/fcm-token:
    post:
      operationId: deviceRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FcmToken"
        required: true
      responses:
        "204":
          description: No Content
      tags:
      - device-controller
  /api/v1/invoices:
    post:
      operationId: invoiceIssue
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewInvoice"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvoiceDto"
          description: Created
      tags:
      - invoice-controller
  /api/v1/invoices/{id}:
    get:
      operationId: invoiceGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvoiceDto"
          description: OK
      tags:
      - invoice-controller
  /api/v1/invoices/{id}/payments:
    get:
      operationId: invoicePayments
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentDto"
          description: OK
      tags:
      - invoice-controller
    post:
      operationId: invoicePay
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentDto"
          description: Created
      tags:
      - invoice-controller
  /api/v1/invoices/{id}/refunds:
    post:
      operationId: invoiceRefund
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentDto"
          description: Created
      tags:
      - invoice-controller
  /api/v1/patients:
    get:
      operationId: patientList
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - in: query
        name: cursor
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Page"
          description: OK
      tags:
      - patient-controller
    post:
      operationId: patientCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatientDto"
          description: Created
      tags:
      - patient-controller
  /api/v1/patients/{id}:
    get:
      operationId: patientGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatientDto"
          description: OK
      tags:
      - patient-controller
    patch:
      operationId: patientUpdate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientDto"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PatientDto"
          description: OK
      tags:
      - patient-controller
  /api/v1/patients/{patientId}/chart:
    get:
      operationId: clinicalChart
      parameters:
      - in: path
        name: patientId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToothRecordDto"
          description: OK
      tags:
      - clinical-controller
  /api/v1/patients/{patientId}/chart/records:
    post:
      operationId: clinicalAddRecords
      parameters:
      - in: path
        name: patientId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ToothRecordDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToothRecordDto"
          description: Created
      tags:
      - clinical-controller
  /api/v1/patients/{patientId}/invoices:
    get:
      operationId: invoiceForPatient
      parameters:
      - in: path
        name: patientId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceDto"
          description: OK
      tags:
      - invoice-controller
  /api/v1/patients/{patientId}/prescriptions:
    get:
      operationId: prescriptionsForPatient
      parameters:
      - in: path
        name: patientId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RxDto"
          description: OK
      tags:
      - prescriptions
  /api/v1/patients/{patientId}/treatment-plans:
    get:
      operationId: clinicalPlans
      parameters:
      - in: path
        name: patientId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanDto"
          description: OK
      tags:
      - clinical-controller
  /api/v1/patients/{patientId}/visits:
    get:
      operationId: clinicalVisits
      parameters:
      - in: path
        name: patientId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitDto"
          description: OK
      tags:
      - clinical-controller
  /api/v1/plan-items/{id}:
    patch:
      operationId: clinicalPlanItem
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanItemPatch"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlanDto"
          description: OK
      tags:
      - clinical-controller
  /api/v1/prescriptions:
    post:
      operationId: prescriptionsIssue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RxDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RxDto"
          description: Created
      tags:
      - prescriptions
  /api/v1/prescriptions/{id}:
    get:
      operationId: prescriptionsGet
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RxDto"
          description: OK
      tags:
      - prescriptions
  /api/v1/procedures:
    get:
      operationId: procedureList
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureDto"
          description: OK
      tags:
      - procedure-catalog
  /api/v1/reports/daily-collection:
    get:
      operationId: reportDailyCollection
      parameters:
      - in: query
        name: date
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DailyCollection"
          description: OK
      tags:
      - report-controller
  /api/v1/reports/dues:
    get:
      operationId: reportDues
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Dues"
          description: OK
      tags:
      - report-controller
  /api/v1/sync/pull:
    get:
      operationId: syncPull
      parameters:
      - in: query
        name: since
        required: false
        schema:
          type: integer
          format: int64
          default: 0
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 500
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PullResponse"
          description: OK
      tags:
      - sync-controller
  /api/v1/sync/push:
    post:
      operationId: syncPush
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PushResponse"
          description: OK
      tags:
      - sync-controller
  /api/v1/treatment-plans:
    post:
      operationId: clinicalSavePlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlanDto"
          description: Created
      tags:
      - clinical-controller
  /api/v1/treatment-plans/{id}:
    patch:
      operationId: clinicalPlanStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanStatus"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PlanDto"
          description: OK
      tags:
      - clinical-controller
  /api/v1/treatment-plans/{id}/invoice:
    post:
      operationId: clinicalInvoicePlan
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePlan"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvoiceDto"
          description: Created
      tags:
      - clinical-controller
  /api/v1/visits:
    post:
      operationId: clinicalSaveVisit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitDto"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VisitDto"
          description: Created
      tags:
      - clinical-controller
  /api/v1/visits/{id}:
    get:
      operationId: clinicalVisit
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VisitDto"
          description: OK
      tags:
      - clinical-controller
components:
  schemas:
    AppointmentDto:
      type: object
      properties:
        chairId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        colorLabel:
          type: integer
          format: int32
        dentistId:
          type: string
          format: uuid
        endAt:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        procedureId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
          minLength: 0
        startAt:
          type: integer
          format: int64
        status:
          type: string
        updatedAt:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
      required:
      - dentistId
      - patientId
    AuditEventDto:
      type: object
      properties:
        action:
          type: string
        actorId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: {}
        hash:
          type: string
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        resourceId:
          type: string
          format: uuid
        resourceType:
          type: string
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        clinicId:
          type: string
          format: uuid
        clinicName:
          type: string
        expiresIn:
          type: integer
          format: int64
        memberId:
          type: string
          format: uuid
        refreshToken:
          type: string
        role:
          type: string
        scopes:
          type: array
          items:
            type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
    ChairDto:
      type: object
      properties:
        active:
          type: boolean
        id:
          type: string
          format: uuid
        name:
          type: string
    Change:
      type: object
      properties:
        data: {}
        entity:
          type: string
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
    ClinicDto:
      type: object
      properties:
        currency:
          type: string
        email:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        status:
          type: string
        timezone:
          type: string
    ClinicPatch:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 120
          minLength: 1
        phone:
          type: string
    DailyCollection:
      type: object
      properties:
        collectedPaise:
          type: integer
          format: int64
        date:
          type: string
          format: date
        payments:
          type: integer
          format: int32
        refundedPaise:
          type: integer
          format: int64
    Dues:
      type: object
      properties:
        duePaise:
          type: integer
          format: int64
        openInvoices:
          type: integer
          format: int32
    FcmToken:
      type: object
      properties:
        token:
          type: string
          maxLength: 4096
          minLength: 0
      required:
      - token
    InvoiceDto:
      type: object
      properties:
        clinicId:
          type: string
          format: uuid
        discountPaise:
          type: integer
          format: int64
        id:
          type: string
          format: uuid
        invoiceNo:
          type: string
        issuedAt:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineDto"
        paidPaise:
          type: integer
          format: int64
        patientId:
          type: string
          format: uuid
        status:
          type: string
        subtotalPaise:
          type: integer
          format: int64
        taxPaise:
          type: integer
          format: int64
        totalPaise:
          type: integer
          format: int64
    InvoiceLineDto:
      type: object
      properties:
        amountPaise:
          type: integer
          format: int64
        description:
          type: string
          maxLength: 200
          minLength: 0
        id:
