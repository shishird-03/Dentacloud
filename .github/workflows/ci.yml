name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # gradlew is committed from Windows without the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew
      # Testcontainers uses the runner's Docker; the Android SDK is preinstalled on ubuntu-latest.
      - name: Backend tests
        run: ./gradlew :backend:test
      - name: Android unit tests and debug build
        run: ./gradlew :android:app:testDebugUnitTest :android:app:assembleDebug
      # Dependency scan (PRD 16): fails on HIGH/CRITICAL in the gradle.lockfile files; accepted ones live in .trivyignore.
      # Run as a plain Docker image, the same command used locally: no third-party action to go missing.
      - name: Dependency scan
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1
          fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --ignorefile /src/.trivyignore --skip-dirs "**/build" --skip-dirs .gradle /src
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
