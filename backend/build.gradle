plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dm)
}

group = 'com.dentacloud'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs << '-parameters'
}

// Security patches ahead of Boot 3.5.16's managed versions (Trivy, 2026-10-19). Drop each line once
// a Boot release manages that version or newer.
ext['jackson-bom.version'] = '2.21.7'   // CVE-2026-89407, -89425, -68497, -91776, -91777
ext['tomcat.version'] = '10.1.61'       // CVE-2026-65182, -65905, -68525
ext['postgresql.version'] = '42.7.12'   // CVE-2026-54291

dependencyManagement {
    imports {
        mavenBom libs.modulith.bom.get().toString()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation libs.springdoc
    implementation libs.bouncycastle
    implementation libs.uuid.creator
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
